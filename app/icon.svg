<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#141419"/>
      <stop offset="100%" stop-color="#0D0D0F"/>
    </radialGradient>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="5.5"/>
    </filter>
  </defs>

  <rect width="64" height="64" fill="url(#bg)"/>

  <!-- single soft bloom behind the accent dot only -->
  <circle cx="40" cy="20" r="4.6" fill="#B8A6FF" opacity="0.5" filter="url(#glow)"/>

  <!-- crisp cluster, following the live field's ~1-in-5 accent ratio -->
  <circle cx="40" cy="20" r="4.6" fill="#C7BBFF"/>

  <circle cx="24" cy="30" r="3.1" fill="#9a9c9f" opacity="0.85"/>
  <circle cx="46" cy="38" r="2.5" fill="#9a9c9f" opacity="0.6"/>
  <circle cx="18" cy="45" r="2.0" fill="#9a9c9f" opacity="0.42"/>
  <circle cx="33" cy="47" r="1.6" fill="#9a9c9f" opacity="0.3"/>
  <circle cx="50" cy="24" r="1.3" fill="#9a9c9f" opacity="0.22"/>
</svg>
